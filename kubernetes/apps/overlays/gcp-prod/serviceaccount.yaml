apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-api-sa
  namespace: default
  annotations:
    # Maps this Kubernetes SA to the GCP Service Account created in iam.tf.
    # GCP parity to: eks.amazonaws.com/role-arn on EKS IRSA.
    # Replace <PROJECT_ID> with your actual GCP project ID.
    iam.gke.io/gcp-service-account: secure-api-sa@<PROJECT_ID>.iam.gserviceaccount.com
