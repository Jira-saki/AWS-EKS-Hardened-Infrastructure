apiVersion: v1
kind: Service
metadata:
  name: secure-api-svc
  annotations:
    # Enables Container-native Load Balancing via Network Endpoint Groups (NEGs).
    # The GKE Gateway controller reads this annotation to wire the ALB directly
    # to Pod IPs instead of Node IPs, giving lower latency and accurate health checks.
    # GCP parity to: alb.ingress.kubernetes.io/target-type: ip on EKS.
    cloud.google.com/neg: '{"ingress": true}'
spec: {}
