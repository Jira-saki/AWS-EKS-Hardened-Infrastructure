###############################################################################
# GKE Gateway API — Cloud Load Balancing with NEGs
# GCP parity to: AWS Load Balancer Controller ALB Ingress on EKS
#
# GatewayClass "gke-l7-global-external-managed" provisions:
#   - A Global External Application Load Balancer (HTTP/HTTPS)
#   - Network Endpoint Groups (NEGs) wired directly to Pod IPs
#   - (optional) Cloud Armor security policy via spec.infrastructure
###############################################################################

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: secure-api-gateway
  namespace: default
  annotations:
    # ── Cloud Armor (optional) ─────────────────────────────────────────────
    # Uncomment and replace with your Cloud Armor policy name to enable WAF:
    # networking.gke.io/v1beta1.FrontendConfig: secure-api-frontend-config
    #
    # ── Static IP (optional) ──────────────────────────────────────────────
    # To use a reserved static IP, create it first and uncomment:
    # networking.gke.io/v1beta1.GatewayAddress: "secure-api-ip"
spec:
  # gke-l7-global-external-managed = Global External ALB (equivalent to AWS ALB)
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: secure-api-route
  namespace: default
spec:
  parentRefs:
    - name: secure-api-gateway
      namespace: default
  rules:
    # Health check endpoint — used by the Gateway health probe
    - matches:
        - path:
            type: PathPrefix
            value: /healthz
      backendRefs:
        - name: secure-api-svc
          port: 80
    # All other traffic
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: secure-api-svc
          port: 80

###############################################################################
# (Optional) FrontendConfig — Cloud Armor WAF Policy attachment
# Uncomment when you have a Cloud Armor security policy created.
###############################################################################
# ---
# apiVersion: networking.gke.io/v1beta1
# kind: FrontendConfig
# metadata:
#   name: secure-api-frontend-config
#   namespace: default
# spec:
#   securityPolicy:
#     name: <CLOUD_ARMOR_POLICY_NAME>
