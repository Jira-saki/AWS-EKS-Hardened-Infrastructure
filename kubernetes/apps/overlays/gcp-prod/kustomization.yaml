apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Base Manifests ──────────────────────────────────────────────────────────
# Points to the cloud-agnostic base (Deployment, Service, PDB)
resources:
  - ../../base
  - serviceaccount.yaml
  - gateway.yaml
  - hpa.yaml

# ── Patches ──────────────────────────────────────────────────────────────────
patches:
  # Security context + ServiceAccount binding (identical to AWS prod overlay)
  - path: patch-deployment.yaml
  # Add NEG annotation to the base Service for Cloud Load Balancing
  - path: patch-service.yaml

# ── Image Override (Artifact Registry) ───────────────────────────────────────
# Uncomment and replace placeholders before deploying to production:
# images:
#   - name: secure-api
#     newName: <REGION>-docker.pkg.dev/<PROJECT_ID>/secure-api/secure-api
#     newTag: prod-latest

# ── Common Labels ─────────────────────────────────────────────────────────────
commonLabels:
  cloud: gcp
  env: prod
