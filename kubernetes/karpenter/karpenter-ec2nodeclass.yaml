apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: Bottlerocket
  role: "KarpenterNodeRole-eks-hardened-prod"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-hardened-prod"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-hardened-prod"
  amiSelectorTerms:
    - name: "bottlerocket-aws-k8s-1.30-x86_64-*"
  tags:
    IntentLabel: "apps"
    KarpenterNodePoolName: "default"
